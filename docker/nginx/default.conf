server {
    listen 80;
    server_name localhost;

    # Resolver dinâmico do Docker para evitar IP antigo preso e erro 502 após recreate do container app
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 20M;

    # Compressão Gzip para reduzir payload de transferência
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logs otimizados
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Cache agressivo para assets imutáveis do Next.js
    location /_next/static/ {
        set $upstream_app http://app:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rota principal e proxy reverso resiliente
    location / {
        set $upstream_app http://app:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }
}
